# .github/workflows/build.yml
name: Build ChessAssist APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"

      - name: Create libstockfish placeholder
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -n "${{ secrets.STOCKFISH_SO_B64 }}" ]; then
            echo "${{ secrets.STOCKFISH_SO_B64 }}" | base64 --decode \
              > app/src/main/jniLibs/arm64-v8a/libstockfish.so
          else
            dd if=/dev/zero bs=1 count=4 2>/dev/null \
              > app/src/main/jniLibs/arm64-v8a/libstockfish.so
          fi

      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssist-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14